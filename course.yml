title: Python เบื้องต้น
programming_language: python
description: >-
  Python เป็นภาษาโปรแกรมทั่วไปที่ได้รับความนิยมเพิ่มขึ้นเรื่อย ๆ ในวงการ Data
  Science บริษัทชั้นนำทั่วโลกใช้ Python
  เพื่อวิเคราะห์ข้อมูลและสร้างความได้เปรียบในการแข่งขัน คอร์สนี้เน้น Python
  สำหรับ Data Science โดยเฉพาะ ไม่ใช่แค่การสอนภาษา Python ทั่วไป ใน Python
  เบื้องต้นของ DataCamp
  จะได้เรียนรู้วิธีจัดเก็บและจัดการข้อมูลอย่างมีประสิทธิภาพ รวมถึงเครื่องมือ
  Data Science ที่ช่วยให้เริ่มวิเคราะห์ข้อมูลได้ด้วยตัวเอง เริ่มต้นหลักสูตร
  Python ออนไลน์ของ DataCamp ได้เลย


  วิดีโอมีสคริปต์แบบเรียลไทม์ที่สามารถเปิดดูได้โดยคลิก "Show transcript"
  ที่มุมล่างซ้ายของวิดีโอ


  ดูอภิธานศัพท์ของคอร์สได้ในส่วน Resources ทางด้านขวา


  หากต้องการรับหน่วยกิต CPE ต้องทำคอร์สให้ครบและได้คะแนนไม่ต่ำกว่า 70%
  ในการประเมินที่กำหนด สามารถไปยังส่วนประเมินได้โดยคลิกที่ป้าย CPE credits
  ทางด้านขวา
