id: 735
title: Python 入門
programming_language: python
description: >-
  Python
  は、データサイエンスの分野でますます人気が高まっている汎用プログラミング言語です。世界中の企業が、データから知見を引き出し、競争力を高めるために
  Python を活用しています。他の Python チュートリアルとは異なり、このコースではデータサイエンスに特化した Python
  を扱います。Python
  入門コースでは、データを保存・操作するための強力な方法や、自分で分析を始めるために役立つデータサイエンスツールについて学びます。DataCamp
  のオンライン Python カリキュラムを今すぐ始めましょう。


  動画には文字起こしが用意されており、動画左下の動画左下の 「文字お越しを表示」 をクリックすると表示できます。


  コースの用語集は、右側のリソースセクションにあります。


  CPE クレジットを取得するには、コースを修了し、認定アセスメントで 70% 以上のスコアを達成する必要があります。右側の CPE
  クレジットの案内をクリックすると、「認定アセスメント」に移動できます。
