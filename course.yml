id: 735
title: Introduktion till Python
programming_language: python
description: >-
  Python är ett allmänt programmeringsspråk som blir allt mer populärt inom
  datavetenskap. Företag världen över använder Python för att utvinna insikter
  från sina data och skaffa sig konkurrensfördelar. Till skillnad från andra
  Python-kurser fokuserar den här kursen specifikt på Python för datavetenskap.
  I kursen Introduktion till Python lär du dig kraftfulla metoder för att lagra
  och bearbeta data, samt användbara verktyg för datavetenskap som hjälper dig
  att börja genomföra egna analyser. Starta DataCamps onlinekurs i Python nu.


  Videorna innehåller direkttextning som du når genom att klicka på "Show
  transcript" längst ned till vänster i videon.


  Kursens ordlista finns till höger i resursavsnittet.


  För att få CPE-poäng behöver du slutföra kursen och nå minst 70 % på den
  kvalificerade bedömningen. Du navigerar till bedömningen genom att klicka på
  CPE-poänglänken till höger.
from: python-base-prod:v3.1.0
