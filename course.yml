id: 735
title: Python 入门
programming_language: python
description: >-
  Python 是一种通用编程语言。现在，这门语言在数据科学领域越来越受欢迎。全球众多公司都在使用 Python 从企业数据中挖掘洞察，抢占市场先机。与其他
  Python 教程不同，本课程专注于数据科学领域的 Python 应用。在我们的《Python
  入门》课程中，你将学习存储和操作数据的各种有效方法，并掌握上手实操数据分析的实用数据科学工具。现在就开始学习 DataCamp 的在线 Python
  课程吧。


  我们的视频提供了实时字幕，点击视频左下角的“显示字幕”即可开启。


  右侧的资源区域提供了课程术语表。


  只需完成课程并在合格测评中达到 70% 的得分，就能获得 CPE 学分。点击右侧的 CPE 学分入口即可进入测评。
