id: 735
title: Python 입문
programming_language: python
description: >-
  Python은 데이터 과학 분야에서 널리 사용되고 있는 범용 프로그래밍 언어입니다. 세계 각지의 기업이 Python을 활용해 데이터에서
  인사이트를 도출하고 경쟁 우위를 확보하고 있습니다. 이 강의는 다른 Python 가이드와는 다르게 데이터 과학에 초점 맞춘 Python
  학습에 집중합니다. Python 입문 강의에서는 데이터를 효과적으로 저장하고 처리하는 다양한 방법과 데이터 분석을 직접 시작하는 데 필요한
  유용한 데이터 분석 도구를 배웁니다. 지금 바로 DataCamp의 온라인 Python 커리큘럼을 시작해보세요.


  동영상에는 실시간 자막이 포함되며, 동영상 왼쪽 하단의 "자막 보기"를 클릭하면 확인할 수 있습니다.


  강의 용어집은 오른쪽 리소스 섹션에서 확인해주세요.


  CPE 학점을 취득하려면 모든 강의를 수강하고 공인 평가 점수가 70점 이상이어야 합니다. 오른쪽의 CPE 학점 안내를 클릭하면 평가
  페이지로 이동할 수 있습니다.
from: python-base-prod:v3.1.0
practice_pool_id: 107
datasets:
