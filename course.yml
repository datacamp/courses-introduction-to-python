id: 735
title: Úvod do Pythonu
programming_language: python
description: >-
  Python je univerzální programovací jazyk, který si získává čím dál větší
  oblibu v oblasti datové vědy. Firmy po celém světě ho využívají k získávání
  poznatků z dat a budování konkurenční výhody. Na rozdíl od jiných Python
  tutoriálů se tento kurz zaměřuje přímo na Python pro datovou vědu. V kurzu
  Úvod do Pythonu se naučíš, jak efektivně ukládat a zpracovávat data, a
  seznámíš se s užitečnými nástroji datové vědy, se kterými budeš moct provádět
  vlastní analýzy. Začni s online Python kurikulem DataCampu ještě dnes.


  Videa obsahují živé přepisy, které zobrazíš kliknutím na „Show transcript" v
  levém dolním rohu videa.


  Glosář kurzu najdeš vpravo v sekci zdrojů.


  Pro získání kreditů CPE musíš kurz dokončit a dosáhnout skóre alespoň 70 % v
  příslušném hodnocení. K hodnocení se dostaneš kliknutím na upozornění na
  kredity CPE vpravo.
from: python-base-prod:v3.1.0
practice_pool_id: 107
datasets:
  baseball.csv: MLB (baseball)
  fifa.csv: FIFA (soccer)
  Introduction to Python.pdf: 'Course Glossary: Introduction to Python'
