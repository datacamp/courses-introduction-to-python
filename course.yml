id: 735
title: Introduction à Python
programming_language: python
description: "Python est un langage de programmation polyvalent qui gagne en popularité pour la science des données. Des entreprises partout dans le monde utilisent Python pour tirer des enseignements de leurs données et obtenir un avantage concurrentiel. Contrairement à d'autres tutoriels Python, ce cours se concentre sur Python spécifiquement pour la science des données. Dans notre cours Introduction à Python, vous apprendrez des façons puissantes de stocker et de manipuler des données, ainsi que des outils utiles en science des données pour commencer à réaliser vos propres analyses. Lancez-vous dès maintenant dans le programme Python en ligne de DataCamp.\n\nLes vidéos contiennent des transcriptions en direct, auxquelles vous pouvez accéder en cliquant sur «\_Show transcript\_» en bas à gauche des vidéos.\n\nLe glossaire du cours se trouve à droite, dans la section des ressources.\n\nPour obtenir des crédits de FPC, vous devez terminer le cours et atteindre un résultat de 70\_% à l'évaluation admissible. Vous pouvez accéder à l'évaluation en cliquant sur l'appel à l'action des crédits de FPC à droite."
