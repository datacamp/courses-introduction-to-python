id: 735
title: Wprowadzenie do Pythona
programming_language: python
description: >-
  Python to język programowania ogólnego przeznaczenia, który zyskuje coraz
  większą popularność w dziedzinie analizy danych. Firmy na całym świecie
  wykorzystują go do wydobywania wartościowych informacji ze swoich danych i
  budowania przewagi konkurencyjnej. W odróżnieniu od innych kursów, ten
  koncentruje się na Pythonie w kontekście data science. W kursie "Wprowadzenie
  do Pythona" poznasz skuteczne sposoby przechowywania i przetwarzania danych
  oraz przydatne narzędzia, które pozwolą ci przeprowadzać własne analizy.
  Rozpocznij kurs już teraz!


  Filmy zawierają transkrypcje na żywo – możesz je wyświetlić, klikając „Pokaż
  transkrypcję" w lewym dolnym rogu odtwarzacza.


  Glosariusz kursu znajdziesz po prawej stronie, w sekcji zasobów.


  Aby uzyskać punkty CPE, musisz ukończyć kurs i zdobyć co najmniej 70% punktów
  w kwalifikowanym teście. Przejdź do testu, klikając informację o punktach CPE
  po prawej stronie.
from: python-base-prod:v3.1.0
practice_pool_id: 107
datasets:
  baseball.csv: MLB (baseball)
  fifa.csv: FIFA (soccer)
  Introduction to Python.pdf: 'Course Glossary: Introduction to Python'
