id: 735
title: Introducere în Python
programming_language: python
description: >-
  Python este un limbaj de programare de uz general, din ce în ce mai popular în
  domeniul științei datelor. Companii din întreaga lume folosesc Python pentru a
  extrage informații valoroase din date și a obține un avantaj competitiv. Spre
  deosebire de alte tutoriale de Python, acest curs se concentrează pe Python
  specific pentru știința datelor. În cursul nostru de Introducere în Python,
  vei învăța metode eficiente de stocare și manipulare a datelor, precum și
  instrumente utile pentru a începe propriile analize. Începe acum curricula
  online de Python oferită de DataCamp.


  Videourile conțin transcrieri live, accesibile prin apăsarea butonului
  „Afișează transcrierea" din colțul din stânga jos al videoclipurilor.


  Glosarul cursului se găsește în dreapta, în secțiunea de resurse.


  Pentru a obține credite CPE, trebuie să finalizezi cursul și să obții un scor
  de 70% la evaluarea calificată. Poți naviga la evaluare apăsând pe notificarea
  de credite CPE din dreapta.
from: python-base-prod:v3.1.0
