id: 735
title: Введение в Python
programming_language: python
description: >-
  Python — язык программирования общего назначения, который становится всё более
  популярным в области науки о данных. Компании по всему миру используют Python
  для извлечения ценных сведений из данных и получения конкурентных преимуществ.
  В отличие от других курсов по Python, этот курс ориентирован именно на
  применение Python в науке о данных. В курсе «Введение в Python» вы узнаете об
  эффективных способах хранения и обработки данных, а также познакомитесь с
  полезными инструментами для проведения собственного анализа. Начните изучение
  Python на DataCamp прямо сейчас.


  Видеоуроки содержат субтитры, которые можно открыть, нажав «Show transcript» в
  левом нижнем углу.


  Глоссарий курса доступен в разделе ресурсов справа.


  Для получения кредитов CPE необходимо пройти курс и набрать не менее 70% в
  квалификационном тесте. Перейти к тесту можно, нажав на баннер CPE credits
  справа.
from: python-base-prod:v3.1.0
practice_pool_id: 107
