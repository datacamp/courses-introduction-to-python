id: 735
title: Introdução ao Python
programming_language: python
description: >-
  O Python é uma linguagem de programação de uso geral que está se tornando cada
  vez mais popular na ciência de dados. Empresas de todo o mundo estão usando o
  Python para obter insights de seus dados e obter uma vantagem competitiva.
  Diferentemente de outros tutoriais de Python, este curso se concentra em
  Python especificamente para ciência de dados. Em nosso curso de Introdução ao
  Python, você aprenderá maneiras poderosas de armazenar e manipular dados e
  ferramentas úteis de ciência de dados para começar a realizar suas próprias
  análises. Inicie agora o currículo online de Python do DataCamp.


  Os vídeos têm transcrições ao vivo, que você pode ver clicando em “Mostrar
  transcrição” no canto inferior esquerdo dos vídeos.


  O glossário do curso está à direita, na seção de recursos.


  Pra conseguir créditos CPE, você precisa terminar o curso e tirar pelo menos
  70% na avaliação. Você pode acessar a avaliação clicando na chamada de
  créditos CPE à direita.
from: python-base-prod:v3.1.0
description_ai_native: >-
  Python is the world’s most popular programming language, powering everything
  from data science to software development to artificial intelligence. This
  course is Python for the AI era. Guided by an AI Tutor that adapts to your
  role and prior experience, you’ll learn the foundations of programming by
  reading and writing Python code.


  In a world where AI writes most code, understanding how code works lets you
  direct AI and evaluate its work precisely, and catch it when it’s wrong.No
  prior experience needed. You’ll finish this course ready to continue your
  journey into AI, data, and software.
