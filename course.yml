id: 735
title: Вступ до Python
programming_language: python
description: >-
  Python — це мова програмування загального призначення, яка стає дедалі
  популярнішою в аналізі даних. Компанії по всьому світу використовують Python,
  щоб отримувати інсайти зі своїх даних і здобувати конкурентну перевагу. На
  відміну від інших підручників з Python, цей курс зосереджений саме на
  використанні Python для науки про дані. На курсі «Вступ до Python» ви
  дізнаєтеся про ефективні способи зберігання та обробки даних, а також про
  корисні інструменти для науки про дані, щоб почати виконувати власні аналізи.
  Розпочніть навчальну програму з Python на DataCamp вже зараз.


  У відео доступні живі транскрипти, які можна відкрити, натиснувши "Show
  transcript" у нижньому лівому куті відео.


  Глосарій курсу розміщено праворуч у розділі з ресурсами.


  Щоб отримати кредити CPE, потрібно завершити курс і набрати 70% на
  кваліфікаційній перевірці. Перейти до перевірки можна, натиснувши на панель
  CPE credits праворуч.
from: python-base-prod:v3.1.0
